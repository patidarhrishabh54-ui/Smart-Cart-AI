{% extends "base.html" %}

{% block title %}
    Page Not Found | SmartCart AI
{% endblock %}

{% block content %}

<section class="error-page">

    <div class="error-card">

        <div class="error-icon">
            <i class="fa-solid fa-magnifying-glass"></i>
        </div>

        <div class="error-code">
            404
        </div>

        <h1>
            Page not found
        </h1>

        <p>
            Sorry sir, the page or product you're looking for
            could not be found.
        </p>

        <div class="error-actions">

            <a
                href="{{ url_for('index') }}"
                class="error-primary-btn"
            >
                <i class="fa-solid fa-house"></i>
                Back to Home
            </a>

            <a
                href="{{ url_for('search') }}"
                class="error-secondary-btn"
            >
                <i class="fa-solid fa-magnifying-glass"></i>
                Explore Products
            </a>

        </div>

    </div>

</section>


<style>

.error-page {
    min-height: 70vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 60px 20px;
    background:
        radial-gradient(
            circle at 30% 20%,
            rgba(99, 102, 241, 0.08),
            transparent 30%
        ),
        #f8fafc;
}

.error-card {
    width: min(600px, 100%);
    padding: 55px 35px;
    text-align: center;
    border-radius: 28px;
    background: #ffffff;
    border: 1px solid #edf0f5;
    box-shadow:
        0 25px 70px rgba(15, 23, 42, 0.09);
}

.error-icon {
    width: 72px;
    height: 72px;
    margin: 0 auto 20px;
    display: grid;
    place-items: center;
    border-radius: 22px;
    background: #eef2ff;
    color: #4f46e5;
    font-size: 27px;
}

.error-code {
    color: #4f46e5;
    font-size: 70px;
    line-height: 1;
    font-weight: 900;
    letter-spacing: -4px;
}

.error-card h1 {
    margin: 15px 0 10px;
    color: #0f172a;
    font-size: 28px;
    letter-spacing: -1px;
}

.error-card p {
    max-width: 420px;
    margin: 0 auto;
    color: #64748b;
    font-size: 14px;
    line-height: 1.7;
}

.error-actions {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-top: 28px;
}

.error-primary-btn,
.error-secondary-btn {
    min-height: 44px;
    padding: 0 18px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    border-radius: 11px;
    font-size: 12px;
    font-weight: 750;
    text-decoration: none;
    transition: .2s ease;
}

.error-primary-btn {
    color: #ffffff;
    background: #4f46e5;
    box-shadow: 0 8px 20px rgba(79,70,229,.20);
}

.error-primary-btn:hover {
    transform: translateY(-1px);
    background: #4338ca;
}

.error-secondary-btn {
    color: #334155;
    background: #ffffff;
    border: 1px solid #dbe1ea;
}

.error-secondary-btn:hover {
    color: #4f46e5;
    border-color: #a5b4fc;
}

@media (max-width: 520px) {

    .error-card {
        padding: 40px 20px;
        border-radius: 22px;
    }

    .error-code {
        font-size: 58px;
    }

    .error-card h1 {
        font-size: 24px;
    }

    .error-actions {
        flex-direction: column;
    }

    .error-primary-btn,
    .error-secondary-btn {
        width: 100%;
    }

}

</style>

{% endblock %}
